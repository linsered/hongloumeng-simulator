<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红楼梦模拟器 - 最简测试版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0505;
            color: #fff5e8;
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #game-container {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1010 100%);
            border: 3px solid #5c3030;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        
        /* 场景背景 */
        #scene-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: 0;
        }
        
        /* 对话容器 - 关键！ */
        #dialogue-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(0, 0, 0, 0.85) 30%, 
                rgba(0, 0, 0, 0.95) 100%);
            padding: 25px 30px 20px;
            z-index: 9999 !important; /* 最高层级 */
        }
        
        #speaker-name {
            font-family: 'KaiTi', 'STKaiti', serif;
            font-size: 18px;
            color: #d4a030;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        #dialogue-text {
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            line-height: 1.8;
            color: #fff5e8 !important; /* 强制白色 */
            min-height: 80px;
            word-wrap: break-word;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative !important;
            z-index: 10000 !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
        }
        
        #choices-container {
            margin-top: 15px;
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 10001 !important;
        }
        
        .choice-btn {
            background: linear-gradient(135deg, #8b2020 0%, #a52a2a 100%);
            color: #fff5e8;
            border: 2px solid #d4a030;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
            z-index: 10001 !important;
        }
        
        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 160, 48, 0.4);
            background: linear-gradient(135deg, #a52a2a 0%, #c04040 100%);
        }
        
        #debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            max-width: 300px;
            z-index: 99999;
            max-height: 200px;
            overflow-y: auto;
        }
        
        #debug-info h3 {
            color: #d4a030;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        #debug-info p {
            margin: 4px 0;
            color: #aaa;
            line-height: 1.4;
        }
        
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="scene-bg"></div>
    
    <!-- 调试信息面板 -->
    <div id="debug-info">
        <h3>🔧 调试面板</h3>
        <div id="debug-content"></div>
    </div>
    
    <!-- 对话区域 - 最高优先级 -->
    <div id="dialogue-area" style="z-index: 9999;">
        <div id="speaker-name">旁白</div>
        <div id="dialogue-text"></div>
        <div id="choices-container"></div>
    </div>
</div>

<!-- 加载游戏数据 -->
<script src="src/js/core/state.js"></script>
<script src="src/js/data/scenes.js"></script>
<script src="src/js/data/characters.js"></script>
<script src="src/js/data/stories.js"></script>

<script>
// 等待DOM加载完成
document.addEventListener('DOMContentLoaded', function() {
    console.log('🎮 最简测试版启动！');
    
    var debugContent = document.getElementById('debug-content');
    
    function log(msg, type) {
        console.log(msg);
        var p = document.createElement('p');
        p.className = type || '';
        p.textContent = msg;
        debugContent.appendChild(p);
    }
    
    // 测试1：检查HLM对象
    log('📦 检查全局对象...');
    if (typeof HLM === 'undefined') {
        log('❌ HLM未定义！JS文件加载失败', 'error');
        return;
    } else {
        log('✅ HLM已定义', 'success');
    }
    
    // 测试2：检查StoryData
    log('\n📖 检查剧情数据...');
    if (!HLM.StoryData) {
        log('❌ HLM.StoryData不存在', 'error');
        return;
    }
    
    var nodeCount = Object.keys(HLM.StoryData).length;
    log('✅ StoryData存在，共 ' + nodeCount + ' 个节点', 'success');
    
    // 测试3：获取贾宝玉起始节点
    var startNode = HLM.StoryData['baoyu_ch1_01'];
    if (!startNode) {
        log('❌ 起始节点 baoyu_ch1_01 不存在！', 'error');
        return;
    }
    
    log('✅ 起始节点存在: ' + startNode.title, 'success');
    log('   speaker: ' + (startNode.speaker || '无'));
    log('   text长度: ' + (startNode.text || '').length + ' 字符');
    log('   choices数: ' + (startNode.choices ? startNode.choices.length : 0));
    
    // 测试4：显示文本（关键步骤）
    log('\n🎯 开始显示文本...');
    
    var speakerEl = document.getElementById('speaker-name');
    var textEl = document.getElementById('dialogue-text');
    
    log('speakerEl: ' + (speakerEl ? '✅' : '❌ NULL'), speakerEl ? 'success' : 'error');
    log('textEl: ' + (textEl ? '✅' : '❌ NULL'), textEl ? 'success' : 'error');
    
    if (!speakerEl || !textEl) {
        log('❌ DOM元素缺失，无法继续', 'error');
        return;
    }
    
    // 设置说话者
    speakerEl.textContent = startNode.speaker || '旁白';
    speakerEl.style.display = 'block';
    speakerEl.style.visibility = 'visible';
    speakerEl.style.opacity = '1';
    log('✅ 说话者已设置: ' + speakerEl.textContent, 'success');
    
    // 获取文本内容
    var text = startNode.text || '【无文本内容】';
    if (text.length === 0) {
        text = '【警告】文本为空！';
        log('⚠️ 文本为空，使用默认文本', 'warning');
    }
    
    // 显示文本 - 多重保险
    textEl.innerHTML = ''; // 清空
    textEl.textContent = text; // 设置文本
    textEl.innerText = text; // 再次确认
    
    // 强制样式
    textEl.style.display = 'block';
    textEl.style.visibility = 'visible';
    textEl.style.opacity = '1';
    textEl.style.color = '#fff5e8';
    textEl.style.position = 'relative';
    textEl.style.zIndex = '10000';
    
    log('✅ 文本已设置，长度: ' + textEl.textContent.length, 'success');
    log('   前50字: ' + text.substring(0, 50));
    
    // 验证显示
    setTimeout(function() {
        var computedStyle = getComputedStyle(textEl);
        log('\n🔍 验证计算样式:');
        log('   display: ' + computedStyle.display);
        log('   visibility: ' + computedStyle.visibility);
        log('   opacity: ' + computedStyle.opacity);
        log('   color: ' + computedStyle.color);
        log('   zIndex: ' + computedStyle.zIndex);
        log('   实际textContent长度: ' + textEl.textContent.length);
        
        if (textEl.textContent.length > 0) {
            log('\n🎉 成功！旁白文本应该已显示！', 'success');
        } else {
            log('\n❌ 失败！文本仍未显示', 'error');
        }
    }, 100);
    
    // 测试5：显示选择按钮
    if (startNode.choices && startNode.choices.length > 0) {
        log('\n🎮 准备选择按钮...');
        
        setTimeout(function() {
            var container = document.getElementById('choices-container');
            container.style.display = 'flex';
            
            startNode.choices.forEach(function(choice, idx) {
                var btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                
                btn.onclick = function() {
                    log('\n👆 点击了: ' + choice.text);
                    
                    // 查找下一个节点
                    var nextNode = HLM.StoryData[choice.next];
                    if (nextNode) {
                        log('→ 进入下一个节点: ' + nextNode.title);
                        
                        // 更新对话
                        speakerEl.textContent = nextNode.speaker || '旁白';
                        textEl.textContent = nextNode.text || '【无文本】';
                        
                        // 更新选择
                        container.innerHTML = '';
                        if (nextNode.choices) {
                            nextNode.choices.forEach(function(c) {
                                var b = document.createElement('button');
                                b.className = 'choice-btn';
                                b.textContent = c.text;
                                b.onclick = function() {
                                    var n = HLM.StoryData[c.next];
                                    if (n) {
                                        speakerEl.textContent = n.speaker || '旁白';
                                        textEl.textContent = n.text || '【无文本】';
                                        
                                        container.innerHTML = '';
                                        if (n.choices) {
                                            n.choices.forEach(function(nc) {
                                                var nb = document.createElement('button');
                                                nb.className = 'choice-btn';
                                                nb.textContent = nc.text;
                                                
                                                if (nc.next && HLM.StoryData[nc.next] && HLM.StoryData[nc.next].isEnding) {
                                                    nb.onclick = function() {
                                                        var ending = HLM.StoryData[nc.next];
                                                        speakerEl.textContent = '🏆 结局';
                                                        textEl.textContent = '\n【' + ending.title + '】\n\n' + ending.text + '\n\n' + (ending.poem || '');
                                                        container.innerHTML = '<button class="choice-btn" onclick="location.reload()">重新开始</button>';
                                                    };
                                                } else if (nc.next) {
                                                    nb.onclick = function() {
                                                        var nn = HLM.StoryData[nc.next];
                                                        if (nn) {
                                                            speakerEl.textContent = nn.speaker || '旁白';
                                                            textEl.textContent = nn.text || '【无文本】';
                                                        }
                                                    };
                                                }
                                                
                                                container.appendChild(nb);
                                            });
                                        }
                                        container.style.display = 'flex';
                                    }
                                };
                                container.appendChild(b);
                            });
                            container.style.display = 'flex';
                        }
                        
                        if (nextNode.isEnding) {
                            log('🏆 这是结局节点！');
                            container.innerHTML = '<button class="choice-btn" onclick="location.reload()">重新开始</button>';
                        }
                    } else {
                        log('⚠️ 下一个节点不存在: ' + choice.next, 'warning');
                    }
                };
                
                container.appendChild(btn);
            });
            
            log('✅ 已显示 ' + startNode.choices.length + ' 个选择按钮', 'success');
        }, 1500);
    }
});
</script>

</body>
</html>
